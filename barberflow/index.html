<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BarberFlow — Agenda tu cita</title>
    <meta name="description" content="Agenda tu cita en la barbería en segundos. Confirmación y recordatorios por WhatsApp." />
    <meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar parpadeos.
      try {
        var t = localStorage.getItem('barberflow_theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
